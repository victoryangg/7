<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>花蓮站內勤｜電報中心 V3</title><style>body{margin:0;font-family:system-ui,'Noto Sans TC',sans-serif;color:#243247;background:#f5f7fb}header{background:white;border-bottom:1px solid #e1e5ec;padding:15px 22px;display:flex;align-items:center;justify-content:space-between}h1{font-size:19px;margin:0}small,.muted{color:#748094}nav{display:flex;gap:8px;padding:12px 20px;background:white;border-bottom:1px solid #e1e5ec;flex-wrap:wrap}nav span{padding:8px 13px;border-radius:8px;color:#66758a}nav .on{background:#e9f0ff;color:#2559ae;font-weight:700}main{padding:16px;display:grid;grid-template-columns:minmax(260px,35%) 1fr;gap:14px;height:calc(100vh - 142px);box-sizing:border-box}.panel{background:white;border:1px solid #e4e9f0;border-radius:13px;overflow:hidden;display:flex;flex-direction:column}.toolbar{padding:14px;border-bottom:1px solid #edf0f5;display:flex;gap:8px;flex-wrap:wrap;align-items:center}button,select,input{font:inherit;border:1px solid #dce2ec;background:white;border-radius:8px;padding:8px 10px}button{cursor:pointer}button.primary{background:#2463d3;color:white;border-color:#2463d3}button.active{background:#e8f0ff;color:#245bb8;border-color:#b5c9f3}input[type=search]{min-width:120px;flex:1}.list{overflow:auto;flex:1}.row{padding:12px 15px;border-bottom:1px solid #f0f2f6;cursor:pointer}.row:hover,.row.selected{background:#f0f5ff}.row strong{display:block;font-size:14px}.row .detail{font-size:12px;color:#6d7b8e;margin-top:5px}.badge{font-size:11px;padding:3px 6px;background:#eef2f7;border-radius:5px;float:right}.content{overflow:auto;flex:1;padding:16px}.pdf{width:100%;height:100%;min-height:400px;border:1px solid #e4e9ef;border-radius:8px}.paper{white-space:pre-wrap;line-height:1.8;border:1px solid #e5e9ef;background:#fcfdff;border-radius:8px;padding:20px;min-height:220px}.field{margin:9px 0}.field label{display:block;font-size:12px;color:#64748b;margin-bottom:4px}.field input,.field select{width:100%;box-sizing:border-box}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.notice{background:#fff9e9;border:1px solid #f4e0a4;padding:10px;border-radius:8px;font-size:12px;color:#7a611b}.empty{padding:26px;color:#6e7b8d;text-align:center}.footer{padding:10px 15px;border-top:1px solid #edf0f5;display:flex;gap:8px;flex-wrap:wrap}#file{display:none}@media(max-width:800px){main{display:block;height:auto}.panel{min-height:350px;margin-bottom:14px}.list{max-height:300px}.pdf{height:480px}} </style></head><body><header><div><h1>臺鐵花蓮站｜內勤工作平台</h1><small>電報中心 V3.0 · 本機測試版（模擬資料）</small></div><span class="muted">未連接內部系統</span></header><nav><span>工作總覽</span><span>行車業務</span><span class="on">電報中心</span><span>報表與交班</span><span>資料查詢</span></nav><main><section class="panel"><div class="toolbar"><button class="primary" id="import">＋ 匯入 PDF</button><input id="file" type="file" accept="application/pdf" multiple><button id="demo">加入示範電報</button></div><div class="toolbar"><input type="search" id="search" placeholder="搜尋編號、內容…"><select id="sort"><option value="new">最新優先</option><option value="old">最舊優先</option><option value="id">電報編號</option><option value="status">處理狀態</option><option value="category">電報類別</option></select><button id="view">詳細模式</button></div><div class="list" id="list"></div></section><section class="panel"><div class="toolbar"><strong id="heading">選擇一份電報</strong><button id="pdfTab" class="active">原始 PDF</button><button id="textTab">純文字</button><span class="muted" id="hint"></span></div><div class="content" id="content"><div class="empty">左側選擇電報，或匯入測試 PDF。</div></div><div class="footer"><button id="save" class="primary">確認並儲存紀錄</button><button id="export">匯出 CSV</button><button id="print">列印 PDF</button><button id="remove">移除本筆</button></div></section></main><script>
let items=[],selected=null,tab='pdf',detailed=false;const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let counter=0;function datefmt(d){return new Date(d).toLocaleString('zh-TW',{hour12:false})}function add(item){items.unshift(item);selected=item.id;render()};function current(){return items.find(x=>x.id===selected)};function render(){let q=$('search').value.toLowerCase(),arr=items.filter(x=>[x.name,x.no,x.text,x.category].join(' ').toLowerCase().includes(q));let mode=$('sort').value;arr.sort((a,b)=>mode==='new'?b.time-a.time:mode==='old'?a.time-b.time:mode==='id'?a.no.localeCompare(b.no):mode==='status'?a.status.localeCompare(b.status):a.category.localeCompare(b.category));$('list').innerHTML=arr.length?arr.map(x=>`<div class="row ${x.id===selected?'selected':''}" data-id="${x.id}"><span class="badge">${esc(x.status)}</span><strong>${esc(x.no||x.name)}</strong><div class="detail">${datefmt(x.time)}${detailed?' · '+esc(x.category)+'<br>'+esc(x.name):''}</div></div>`).join(''):'<div class="empty">尚無符合條件的電報</div>';document.querySelectorAll('.row').forEach(el=>el.onclick=()=>{selected=el.dataset.id;render()});$('view').textContent=detailed?'極簡模式':'詳細模式';let x=current();$('heading').textContent=x?x.name:'選擇一份電報';$('pdfTab').classList.toggle('active',tab==='pdf');$('textTab').classList.toggle('active',tab==='text');$('hint').textContent=x?(x.extracted?'文字已擷取（請人工核對）':'文字未擷取') :'';if(!x){$('content').innerHTML='<div class="empty">左側選擇電報，或匯入測試 PDF。</div>';return}if(tab==='pdf'){$('content').innerHTML=x.url?`<iframe class="pdf" title="原始 PDF" src="${x.url}"></iframe>`:`<div class="paper">${esc(x.text)}</div>`}else{$('content').innerHTML=`<div class="notice">PDF 擷取結果僅供輔助閱讀；編號、日期、內容及處理方式請以原始文件人工核對。若文字擷取失敗，可手動貼上文字。</div><div class="paper" contenteditable="true" id="textBody">${esc(x.text||'（尚無可擷取文字，請在此貼上或輸入）')}</div><div class="grid"><div class="field"><label>電報編號</label><input id="no" value="${esc(x.no)}"></div><div class="field"><label>電報類別</label><select id="category">${['待分類','行車運轉','客車運用','臨時變更','行政公告','待回覆','其他通知'].map(v=>`<option ${x.category===v?'selected':''}>${v}</option>`).join('')}</select></div><div class="field"><label>處理狀態</label><select id="status">${['待處理','處理中','待確認','已完成'].map(v=>`<option ${x.status===v?'selected':''}>${v}</option>`).join('')}</select></div><div class="field"><label>轉交對象（測試文字）</label><input id="assignee" value="${esc(x.assignee||'')}"></div></div>`}}
function save(){let x=current();if(!x)return alert('請先選擇電報');if(tab==='text'){x.text=$('textBody').innerText;x.no=$('no').value;x.category=$('category').value;x.status=$('status').value;x.assignee=$('assignee').value;render()}alert('已更新本次測試紀錄（僅保留在目前頁面，重新整理後消失）。')};$('save').onclick=save;$('import').onclick=()=>$('file').click();$('file').onchange=async e=>{for(let f of e.target.files){if(f.type!=='application/pdf')continue;let id='f'+(++counter),url=URL.createObjectURL(f),x={id,name:f.name,no:f.name.replace(/\.pdf$/i,''),time:Date.now()+counter,url,text:'',extracted:false,category:'待分類',status:'待處理'};add(x);try{if(!window.pdfjsLib)await loadPdfJs();let doc=await pdfjsLib.getDocument({data:new Uint8Array(await f.arrayBuffer())}).promise;let parts=[];for(let p=1;p<=Math.min(doc.numPages,100);p++){let page=await doc.getPage(p),tc=await page.getTextContent();parts.push(tc.items.map(i=>i.str).join(' '))}x.text=parts.join('\n\n');x.extracted=!!x.text.trim();}catch(err){x.text='';x.extracted=false;}render()}e.target.value=''};function loadPdfJs(){return new Promise((resolve,reject)=>{let s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';s.onload=()=>{pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';resolve()};s.onerror=()=>reject(new Error('無法載入 PDF 文字解析元件'));document.head.appendChild(s)})};$('demo').onclick=()=>add({id:'d'+(++counter),name:'示範電報 '+counter,no:'DEMO-'+String(counter).padStart(3,'0'),time:Date.now(),url:null,text:'【模擬電報，非正式文件】\n日期：2026/10/30\n內容：客車運用資料異動示例，請承辦人員核對。\n注意：本內容完全虛構。',extracted:true,category:'客車運用',status:'待處理'});$('search').oninput=render;$('sort').onchange=render;$('view').onclick=()=>{detailed=!detailed;render()};$('pdfTab').onclick=()=>{if(tab==='text'&&current())saveSilent();tab='pdf';render()};$('textTab').onclick=()=>{tab='text';render()};function saveSilent(){let x=current();if(x&&$('textBody')){x.text=$('textBody').innerText;x.no=$('no').value;x.category=$('category').value;x.status=$('status').value;x.assignee=$('assignee').value}}$('export').onclick=()=>{saveSilent();let cols=['電報編號','檔名','時間','類別','狀態','轉交對象','文字內容'];let rows=items.map(x=>[x.no,x.name,datefmt(x.time),x.category,x.status,x.assignee||'',x.text]);let csv='\ufeff'+[cols,...rows].map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='電報測試紀錄.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$('print').onclick=()=>{let x=current();if(x?.url)window.open(x.url,'_blank');else alert('此筆沒有原始 PDF 可列印')};$('remove').onclick=()=>{let x=current();if(!x)return;if(!confirm('移除此筆測試資料？'))return;if(x.url)URL.revokeObjectURL(x.url);items=items.filter(i=>i.id!==selected);selected=items[0]?.id||null;render()};render();</script></body></html>
