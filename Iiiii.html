<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>花蓮站內勤平台 V4.0｜示範</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Noto Sans TC',sans-serif;color:#17324d;background:#f4f7fb}*{box-sizing:border-box}body{margin:0}header{background:#fff;border-bottom:1px solid #dbe3ec;padding:16px 22px;display:flex;justify-content:space-between;align-items:center;gap:10px}h1{font-size:21px;margin:0}small,.muted{color:#687d91}.badge{background:#fff2d7;color:#855c0c;border-radius:20px;padding:6px 10px;font-size:12px}nav{display:flex;gap:7px;overflow-x:auto;padding:12px 16px;background:white;border-bottom:1px solid #dce5ed}button,input,select,textarea{font:inherit}button{border:1px solid #cad8e6;background:white;color:#17324d;padding:10px 13px;border-radius:10px;cursor:pointer;min-height:42px}button.primary,nav button.active{background:#1367ad;color:white;border-color:#1367ad}button:active{opacity:.7}main{max-width:1400px;margin:auto;padding:18px}section.page{display:none}section.page.active{display:block}.card{background:white;border:1px solid #dce5ed;border-radius:14px;padding:18px;margin-bottom:14px;box-shadow:0 2px 8px #102b4408}h2{margin:0 0 14px;font-size:20px}h3{margin:0 0 12px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row>*{max-width:100%}input,select,textarea{border:1px solid #cad8e6;border-radius:9px;padding:10px;background:white;min-height:42px}textarea{width:100%;min-height:110px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.metric{font-size:28px;font-weight:700;color:#1367ad}.split{display:grid;grid-template-columns:minmax(280px,35%) minmax(0,65%);gap:14px}.list{max-height:62vh;overflow:auto}.item{display:block;text-align:left;width:100%;margin:7px 0}.item.selected{border-color:#1367ad;background:#edf6ff}.item strong{display:block;margin-bottom:4px}.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.tools input{flex:1;min-width:140px}iframe{width:100%;height:390px;border:1px solid #dce5ed;border-radius:10px}pre{white-space:pre-wrap;word-break:break-word;font:inherit;line-height:1.8}.tablewrap{overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{padding:11px;border-bottom:1px solid #e5ebf1;text-align:left}th{background:#f6f9fc}.notice{background:#eaf5ff;border-left:4px solid #1367ad;padding:12px;border-radius:7px;margin-bottom:14px}.danger{color:#a32f2f}.pill{font-size:12px;background:#e9f2fa;border-radius:20px;padding:4px 8px}.hidden{display:none!important}@media(max-width:800px){.grid{grid-template-columns:1fr}.split{grid-template-columns:1fr}.list{max-height:260px}header{align-items:flex-start;flex-direction:column}main{padding:12px}nav button{white-space:nowrap}}
</style></head><body><header><div><h1>🚆 花蓮站內勤工作整合平台 <span style="font-weight:400">V4.0</span></h1><small>互動測試版｜虛構資料｜不連接臺鐵內部系統</small></div><span class="badge">僅供示範・勿輸入公務機敏資料</span></header><nav id="nav"><button data-page="overview">工作總覽</button><button data-page="operations">行車業務</button><button data-page="telegrams" class="active">電報中心</button><button data-page="handoff">報表與交班</button><button data-page="search">資料查詢</button></nav><main>
<section id="overview" class="page"><h2>工作總覽</h2><div class="grid"><div class="card">今日電報<div id="mTotal" class="metric">0</div></div><div class="card">待處理電報<div id="mPending" class="metric">0</div></div><div class="card">未完成交班<div id="mHandoff" class="metric">0</div></div></div><div class="card"><h3>今日工作提醒</h3><div id="overviewItems"></div><div class="row"><button class="primary" onclick="showPage('telegrams')">前往電報中心</button><button onclick="showPage('handoff')">前往交班</button></div></div></section>
<section id="operations" class="page"><h2>行車業務</h2><div class="notice">以下僅為文書追蹤示範，不產生或執行任何行車指令；實際作業以授權系統及人員確認為準。</div><div class="card"><h3>新增業務紀錄</h3><div class="row"><select id="opType"><option>車號</option><option>客車運用</option><option>調度所聯繫</option></select><input id="opRef" placeholder="參考編號（虛構）"><input id="opNote" placeholder="紀錄摘要（測試）" style="flex:2"><button class="primary" onclick="addOp()">新增紀錄</button></div></div><div class="card"><h3>業務紀錄清單</h3><div id="opTable" class="tablewrap"></div></div></section>
<section id="telegrams" class="page active"><div class="row" style="justify-content:space-between"><h2>電報中心</h2><div class="row"><button onclick="addDemo()" class="primary">＋加入示範電報</button><label class="primary" style="display:inline-flex;align-items:center;border-radius:10px;padding:10px 13px;background:#1367ad;color:white;cursor:pointer">匯入測試 PDF<input id="pdfInput" type="file" accept="application/pdf" multiple hidden></label></div></div><div class="split"><div class="card"><div class="tools"><input id="filter" placeholder="搜尋編號／內容／類別"><select id="sort"><option value="new">最新優先</option><option value="old">最舊優先</option><option value="id">編號</option><option value="status">狀態</option><option value="category">類別</option></select><button id="detailToggle" onclick="toggleDetails()">切換詳細模式</button></div><div id="telegramList" class="list"></div></div><div class="card"><div id="telegramEmpty">請從左側選擇電報，或加入示範電報。</div><div id="telegramDetail" class="hidden"><h3 id="telegramTitle"></h3><div class="tools"><button id="pdfTab" onclick="setView('pdf')">原始 PDF</button><button id="textTab" onclick="setView('text')">純文字</button></div><div id="pdfPanel"></div><div id="textPanel" class="hidden"><pre id="telegramText"></pre><textarea id="manualText" placeholder="可手動補充文字（不會自動 OCR）"></textarea><button onclick="saveText()">儲存文字</button></div><hr style="border:0;border-top:1px solid #e1e8ef;margin:18px 0"><h3>處理紀錄</h3><div class="row"><label>類別 <select id="tgCategory"><option>未分類</option><option>行車通知</option><option>客車運用</option><option>行政通知</option><option>其他</option></select></label><label>狀態 <select id="tgStatus"><option>待處理</option><option>處理中</option><option>已完成</option></select></label><input id="tgOwner" placeholder="轉交對象（測試）"><button class="primary" onclick="saveTelegram()">儲存紀錄</button></div></div></div></div></section>
<section id="handoff" class="page"><h2>報表與交班</h2><div class="card"><h3>新增交班事項</h3><div class="row"><input id="handTitle" placeholder="交班事項（測試）" style="flex:2"><select id="handStatus"><option>未完成</option><option>已完成</option></select><button class="primary" onclick="addHandoff()">新增交班</button></div></div><div class="card"><h3>交班清單</h3><div id="handTable" class="tablewrap"></div><div class="row" style="margin-top:12px"><button onclick="exportCsv('handoff')">匯出交班 CSV</button><button onclick="exportCsv('telegram')">匯出電報 CSV</button><button onclick="exportCsv('operation')">匯出行車業務 CSV</button></div></div></section>
<section id="search" class="page"><h2>資料查詢</h2><div class="card"><div class="row"><input id="globalQuery" placeholder="搜尋電報、業務、交班內容" style="flex:1" oninput="renderSearch()"><button onclick="document.getElementById('globalQuery').value='';renderSearch()">清除</button></div><div id="searchResults" style="margin-top:14px"></div></div></section>
</main><script>
const KEY='hualien_demo_v4';let state;try{state=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!state||!Array.isArray(state.telegrams))state={telegrams:[],operations:[],handoffs:[]};let selected=null,view='text',details=false,urls={};function persist(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){alert('本機儲存空間不足，請先匯出紀錄')}}function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,5)}function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function showPage(p){document.querySelectorAll('.page').forEach(x=>x.classList.toggle('active',x.id===p));document.querySelectorAll('#nav button').forEach(x=>x.classList.toggle('active',x.dataset.page===p));renderAll()}document.querySelectorAll('#nav button').forEach(b=>b.addEventListener('click',()=>showPage(b.dataset.page)));
function addDemo(){let id=uid();state.telegrams.unshift({id,number:'DEMO-'+String(state.telegrams.length+1).padStart(3,'0'),date:new Date().toLocaleString('zh-TW'),category:'行車通知',status:'待處理',owner:'',text:'【虛構測試電報】\n編號：DEMO-001\n主旨：測試資料更新通知\n本文件僅供網頁功能測試，不具有行車效力。',pdf:false});selected=id;persist();renderAll()}
function renderTelegrams(){let q=document.getElementById('filter').value.trim().toLowerCase(),sort=document.getElementById('sort').value;let a=state.telegrams.filter(t=>[t.number,t.text,t.category,t.status,t.owner].join(' ').toLowerCase().includes(q));a.sort((x,y)=>sort==='old'?x.id.localeCompare(y.id):sort==='id'?x.number.localeCompare(y.number):sort==='status'?x.status.localeCompare(y.status):sort==='category'?x.category.localeCompare(y.category):y.id.localeCompare(x.id));document.getElementById('telegramList').innerHTML=a.length?a.map(t=>`<button class="item ${t.id===selected?'selected':''}" data-id="${escapeHtml(t.id)}"><strong>${escapeHtml(t.number)} <span class="pill">${escapeHtml(t.status)}</span></strong><small>${escapeHtml(t.date)}${details?'｜'+escapeHtml(t.category)+'｜'+escapeHtml(t.owner||'未分派'):''}</small>${details?'<div>'+escapeHtml((t.text||'').slice(0,65))+'</div>':''}</button>`).join(''):'<p class="muted">目前沒有符合的電報。</p>';document.querySelectorAll('#telegramList button').forEach(b=>b.addEventListener('click',()=>{selected=b.dataset.id;renderTelegrams();renderSelected()}));renderSelected()}
function toggleDetails(){details=!details;document.getElementById('detailToggle').textContent=details?'切換極簡模式':'切換詳細模式';renderTelegrams()}
function renderSelected(){let t=state.telegrams.find(x=>x.id===selected);document.getElementById('telegramEmpty').classList.toggle('hidden',!!t);document.getElementById('telegramDetail').classList.toggle('hidden',!t);if(!t)return;document.getElementById('telegramTitle').textContent=t.number+'｜'+t.date;document.getElementById('tgCategory').value=t.category;document.getElementById('tgStatus').value=t.status;document.getElementById('tgOwner').value=t.owner||'';document.getElementById('telegramText').textContent=t.text||'尚未擷取文字，請手動補充。';document.getElementById('manualText').value=t.text||'';setView(view)}function setView(v){view=v;let t=state.telegrams.find(x=>x.id===selected);if(!t)return;document.getElementById('pdfTab').classList.toggle('primary',v==='pdf');document.getElementById('textTab').classList.toggle('primary',v==='text');document.getElementById('pdfPanel').classList.toggle('hidden',v!=='pdf');document.getElementById('textPanel').classList.toggle('hidden',v!=='text');let p=document.getElementById('pdfPanel');p.innerHTML=v!=='pdf'?'':t.pdf&&urls[t.id]?`<iframe title="PDF預覽" src="${urls[t.id]}"></iframe>`:t.pdf?'<p class="notice">本次重新整理後，原始 PDF 檔案需重新匯入才能預覽；文字與處理紀錄仍保留。</p>':'<div class="notice">這是示範文字電報，沒有原始 PDF。可使用「純文字」閱讀。</div>'}function saveTelegram(){let t=state.telegrams.find(x=>x.id===selected);if(!t)return;t.category=document.getElementById('tgCategory').value;t.status=document.getElementById('tgStatus').value;t.owner=document.getElementById('tgOwner').value;persist();renderAll();alert('處理紀錄已儲存')}function saveText(){let t=state.telegrams.find(x=>x.id===selected);if(!t)return;t.text=document.getElementById('manualText').value;persist();renderAll();alert('文字已儲存')}
document.getElementById('pdfInput').addEventListener('change',e=>{let fs=Array.from(e.target.files||[]);fs.forEach(f=>{if(f.type!=='application/pdf'&&!f.name.toLowerCase().endsWith('.pdf'))return;let id=uid();urls[id]=URL.createObjectURL(f);state.telegrams.unshift({id,number:f.name.replace(/\.pdf$/i,''),date:new Date().toLocaleString('zh-TW'),category:'未分類',status:'待處理',owner:'',text:'',pdf:true});selected=id});persist();view='pdf';renderAll();e.target.value='';if(fs.length)alert('已匯入 PDF 供本次預覽。此版本尚未自動擷取 PDF 文字，請使用純文字模式手動輸入。')});
document.getElementById('filter').addEventListener('input',renderTelegrams);document.getElementById('sort').addEventListener('change',renderTelegrams);
function addOp(){let type=document.getElementById('opType').value,ref=document.getElementById('opRef').value.trim(),note=document.getElementById('opNote').value.trim();if(!ref&&!note)return alert('請輸入編號或摘要');state.operations.unshift({id:uid(),type,ref,note,date:new Date().toLocaleString('zh-TW')});document.getElementById('opRef').value='';document.getElementById('opNote').value='';persist();renderAll()}function addHandoff(){let title=document.getElementById('handTitle').value.trim();if(!title)return alert('請輸入交班事項');state.handoffs.unshift({id:uid(),title,status:document.getElementById('handStatus').value,date:new Date().toLocaleString('zh-TW')});document.getElementById('handTitle').value='';persist();renderAll()}function changeHand(id){let t=state.handoffs.find(x=>x.id===id);if(t){t.status=t.status==='已完成'?'未完成':'已完成';persist();renderAll()}}
function renderOps(){document.getElementById('opTable').innerHTML=state.operations.length?'<table><tr><th>時間</th><th>類別</th><th>編號</th><th>摘要</th></tr>'+state.operations.map(x=>`<tr><td>${escapeHtml(x.date)}</td><td>${escapeHtml(x.type)}</td><td>${escapeHtml(x.ref)}</td><td>${escapeHtml(x.note)}</td></tr>`).join('')+'</table>':'<p class="muted">尚無紀錄，可先新增測試資料。</p>'}function renderHandoff(){document.getElementById('handTable').innerHTML=state.handoffs.length?'<table><tr><th>日期</th><th>事項</th><th>狀態</th><th>操作</th></tr>'+state.handoffs.map(x=>`<tr><td>${escapeHtml(x.date)}</td><td>${escapeHtml(x.title)}</td><td>${escapeHtml(x.status)}</td><td><button data-hand="${x.id}">切換狀態</button></td></tr>`).join('')+'</table>':'<p class="muted">尚無交班事項。</p>';document.querySelectorAll('[data-hand]').forEach(b=>b.addEventListener('click',()=>changeHand(b.dataset.hand)))}function renderOverview(){document.getElementById('mTotal').textContent=state.telegrams.length;document.getElementById('mPending').textContent=state.telegrams.filter(t=>t.status!=='已完成').length;document.getElementById('mHandoff').textContent=state.handoffs.filter(t=>t.status!=='已完成').length;let pending=state.telegrams.filter(t=>t.status!=='已完成');document.getElementById('overviewItems').innerHTML=pending.length?pending.slice(0,6).map(t=>`<p>📩 ${escapeHtml(t.number)}｜${escapeHtml(t.status)}</p>`).join(''):'<p class="muted">目前沒有待處理的示範電報。</p>'}function renderSearch(){let q=document.getElementById('globalQuery').value.toLowerCase().trim();let a=[...state.telegrams.map(t=>({type:'電報',name:t.number,desc:t.category+' '+t.status+' '+t.text})),...state.operations.map(t=>({type:'行車業務',name:t.type+' '+t.ref,desc:t.note})),...state.handoffs.map(t=>({type:'交班',name:t.title,desc:t.status}))].filter(x=>(x.type+x.name+x.desc).toLowerCase().includes(q));document.getElementById('searchResults').innerHTML=a.length?a.map(x=>`<div style="padding:12px;border-bottom:1px solid #e4ebf2"><span class="pill">${escapeHtml(x.type)}</span> <strong>${escapeHtml(x.name)}</strong><div class="muted">${escapeHtml(x.desc.slice(0,130))}</div></div>`).join(''):'<p class="muted">沒有符合的資料。</p>'}function exportCsv(type){let heads,rows;if(type==='telegram'){heads=['電報編號','時間','類別','狀態','轉交對象','文字'];rows=state.telegrams.map(t=>[t.number,t.date,t.category,t.status,t.owner,t.text])}else if(type==='handoff'){heads=['日期','交班事項','狀態'];rows=state.handoffs.map(t=>[t.date,t.title,t.status])}else{heads=['日期','類別','編號','摘要'];rows=state.operations.map(t=>[t.date,t.type,t.ref,t.note])}let csv='\ufeff'+[heads,...rows].map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');let a=document.createElement('a'),u=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.href=u;a.download=type+'-demo.csv';a.click();setTimeout(()=>URL.revokeObjectURL(u),3000)}function renderAll(){renderTelegrams();renderOps();renderHandoff();renderOverview();renderSearch()}renderAll();
</script></body></html>
